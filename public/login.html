<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopMart - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
    <a href="report-bug.html">Report a Bug</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="admin.html">Admin</a>
  </nav>

  <div class="container">
    <h1>Login</h1>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username">

      <label for="password">Password</label>
      <!-- BUG-02 (CRITICAL): input type is "text" instead of "password",
           so the password is shown in plain text as the user types it.
           Fix: change type="text" to type="password". -->
      <input type="text" id="password" name="password" placeholder="Enter password">

      <!-- BUG-01 (CRITICAL): this button calls a JS function that does
           not exist / is never wired up, so clicking "Login" does
           absolutely nothing - no error, no redirect, no action at all.
           Fix: attach a real onclick/submit handler, e.g. loginUser(). -->
      <button type="button" id="loginBtn" onclick="thisFunctionDoesNotExist()">Login</button>
    </form>

    <p class="small-note">Don't have an account? <a href="signup.html">Sign up here</a>.</p>
  </div>

  <footer>&copy; 2020 ShopMart Inc. All rights reserved.</footer>

  <script src="js/main.js"></script>
</body>
</html>
